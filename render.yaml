# Render configuration for the static site (optional convenience — you can also set these in the
# Render dashboard). The rewrite makes the single-page app handle its own routing.
services:
  - type: web
    name: fdc-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
