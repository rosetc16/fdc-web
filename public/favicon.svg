<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fantasy Draft Compass mark: a football that doubles as a compass housing (matches the app + loading screen). -->
  <defs>
    <radialGradient id="L" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#A9612E"/><stop offset="55%" stop-color="#8A4A22"/><stop offset="100%" stop-color="#5E3115"/>
    </radialGradient>
    <linearGradient id="N" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2655C"/><stop offset="100%" stop-color="#B33"/>
    </linearGradient>
  </defs>
  <!-- dark rounded background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#14120B"/>
  <g transform="translate(32,32) scale(0.56) translate(-50,-50)">
    <!-- football body -->
    <g transform="rotate(-32 50 50)">
      <ellipse cx="50" cy="50" rx="46" ry="30" fill="url(#L)" stroke="#3A1E0C" stroke-width="2.5"/>
      <path d="M6 50 q4 -6 4 -0 q0 6 -4 0Z" fill="#F0E4CC" opacity="0.9"/>
      <path d="M94 50 q-4 -6 -4 -0 q0 6 4 0Z" fill="#F0E4CC" opacity="0.9"/>
      <line x1="16" y1="50" x2="84" y2="50" stroke="#F0E4CC" stroke-width="2" opacity="0.5" stroke-dasharray="1 3"/>
    </g>
    <!-- compass dial -->
    <circle cx="50" cy="50" r="27" fill="#2A1608" stroke="#C8873C" stroke-width="1.5"/>
    <line x1="50" y1="26" x2="50" y2="30" stroke="#FFD071" stroke-width="2" transform="rotate(0 50 50)"/>
    <line x1="50" y1="26" x2="50" y2="30" stroke="#FFD071" stroke-width="2" transform="rotate(90 50 50)"/>
    <line x1="50" y1="26" x2="50" y2="30" stroke="#FFD071" stroke-width="2" transform="rotate(180 50 50)"/>
    <line x1="50" y1="26" x2="50" y2="30" stroke="#FFD071" stroke-width="2" transform="rotate(270 50 50)"/>
    <!-- needle -->
    <polygon points="50,27 44,50 50,50" fill="url(#N)"/>
    <polygon points="50,27 56,50 50,50" fill="#D9463E"/>
    <polygon points="50,73 44,50 50,50" fill="#E7EEF5"/>
    <polygon points="50,73 56,50 50,50" fill="#B9C6D3"/>
    <circle cx="50" cy="50" r="4.5" fill="#2A1608" stroke="#FFD071" stroke-width="1.5"/>
  </g>
</svg>
