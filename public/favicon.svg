<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fantasy Draft Compass mark: a compass rose with a football outline engrained at its center. -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#14120B"/>
  <g transform="translate(32,32) scale(0.58) translate(-50,-50)">
    <!-- compass rose -->
    <circle cx="50" cy="50" r="47" fill="none" stroke="#F2B63C" stroke-width="1.6" opacity="0.75"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#3A4757" stroke-width="1" opacity="0.55"/>
    <g stroke="#F2B63C" stroke-width="2" stroke-linecap="round">
      <line x1="50" y1="5" x2="50" y2="13" transform="rotate(0 50 50)"/>
      <line x1="50" y1="5" x2="50" y2="13" transform="rotate(90 50 50)"/>
      <line x1="50" y1="5" x2="50" y2="13" transform="rotate(180 50 50)"/>
      <line x1="50" y1="5" x2="50" y2="13" transform="rotate(270 50 50)"/>
    </g>
    <g stroke="#3A4757" stroke-width="1" stroke-linecap="round" opacity="0.6">
      <line x1="50" y1="7" x2="50" y2="11" transform="rotate(45 50 50)"/>
      <line x1="50" y1="7" x2="50" y2="11" transform="rotate(135 50 50)"/>
      <line x1="50" y1="7" x2="50" y2="11" transform="rotate(225 50 50)"/>
      <line x1="50" y1="7" x2="50" y2="11" transform="rotate(315 50 50)"/>
    </g>
    <!-- football outline engrained at center -->
    <g transform="rotate(-38 50 50)">
      <path d="M50 28 C64 28 78 38 78 50 C78 62 64 72 50 72 C36 72 22 62 22 50 C22 38 36 28 50 28 Z" fill="none" stroke="#F2B63C" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M22 50 L15 50 M78 50 L85 50" stroke="#F2B63C" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="40" y1="50" x2="60" y2="50" stroke="#F2B63C" stroke-width="1.6" opacity="0.85"/>
      <line x1="44.5" y1="47" x2="44.5" y2="53" stroke="#F2B63C" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
      <line x1="48.2" y1="47" x2="48.2" y2="53" stroke="#F2B63C" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
      <line x1="51.8" y1="47" x2="51.8" y2="53" stroke="#F2B63C" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
      <line x1="55.5" y1="47" x2="55.5" y2="53" stroke="#F2B63C" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>
</svg>
