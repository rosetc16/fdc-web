<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fantasy Draft Compass: prominent compass rose with a small football tucked into the center. -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#14120B"/>
  <g transform="translate(32,32) scale(0.6) translate(-50,-50)">
    <circle cx="50" cy="50" r="47" fill="none" stroke="#F2B63C" stroke-width="2.2" opacity="0.9"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#3A4757" stroke-width="1" opacity="0.5"/>
    <g stroke="#3A4757" stroke-linecap="round" opacity="0.55">
      <line x1="50" y1="6" x2="50" y2="11" transform="rotate(30 50 50)" stroke-width="0.9"/>
      <line x1="50" y1="6" x2="50" y2="11" transform="rotate(60 50 50)" stroke-width="0.9"/>
      <line x1="50" y1="6" x2="50" y2="11" transform="rotate(120 50 50)" stroke-width="0.9"/>
      <line x1="50" y1="6" x2="50" y2="11" transform="rotate(150 50 50)" stroke-width="0.9"/>
      <line x1="50" y1="6" x2="50" y2="11" transform="rotate(210 50 50)" stroke-width="0.9"/>
      <line x1="50" y1="6" x2="50" y2="11" transform="rotate(240 50 50)" stroke-width="0.9"/>
      <line x1="50" y1="6" x2="50" y2="11" transform="rotate(300 50 50)" stroke-width="0.9"/>
      <line x1="50" y1="6" x2="50" y2="11" transform="rotate(330 50 50)" stroke-width="0.9"/>
    </g>
    <!-- cardinal ticks -->
    <g stroke="#F2B63C" stroke-width="2.2" stroke-linecap="round">
      <line x1="50" y1="4" x2="50" y2="13" transform="rotate(0 50 50)"/>
      <line x1="50" y1="4" x2="50" y2="13" transform="rotate(90 50 50)"/>
      <line x1="50" y1="4" x2="50" y2="13" transform="rotate(180 50 50)"/>
      <line x1="50" y1="4" x2="50" y2="13" transform="rotate(270 50 50)"/>
    </g>
    <!-- rose star -->
    <g>
      <polygon points="50,13 53,50 50,50" fill="#F2B63C" transform="rotate(0 50 50)"/>
      <polygon points="50,13 47,50 50,50" fill="#FFD071" opacity="0.75" transform="rotate(0 50 50)"/>
      <polygon points="50,13 53,50 50,50" fill="#F2B63C" transform="rotate(90 50 50)"/>
      <polygon points="50,13 47,50 50,50" fill="#FFD071" opacity="0.75" transform="rotate(90 50 50)"/>
      <polygon points="50,13 53,50 50,50" fill="#F2B63C" transform="rotate(180 50 50)"/>
      <polygon points="50,13 47,50 50,50" fill="#FFD071" opacity="0.75" transform="rotate(180 50 50)"/>
      <polygon points="50,13 53,50 50,50" fill="#F2B63C" transform="rotate(270 50 50)"/>
      <polygon points="50,13 47,50 50,50" fill="#FFD071" opacity="0.75" transform="rotate(270 50 50)"/>
    </g>
    <!-- small football at center -->
    <g transform="rotate(-38 50 50)" opacity="0.55">
      <ellipse cx="50" cy="50" rx="11" ry="6.5" fill="#14120B" stroke="#F2B63C" stroke-width="1.1"/>
      <line x1="44" y1="50" x2="56" y2="50" stroke="#F2B63C" stroke-width="0.9"/>
      <line x1="47" y1="48" x2="47" y2="52" stroke="#F2B63C" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="50" y1="48" x2="50" y2="52" stroke="#F2B63C" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="53" y1="48" x2="53" y2="52" stroke="#F2B63C" stroke-width="0.8" stroke-linecap="round"/>
    </g>
    <circle cx="50" cy="50" r="2.4" fill="#F2B63C"/>
  </g>
</svg>
